# ofm-server 配置文件
#
# 本文件同时充当两个角色：
#   1. 仓库里的默认配置（编译期内嵌进二进制，是默认值的唯一真相）
#   2. 用户配置模板（`ofm-server config > config.toml` 即可得到一份可用配置）
#
# 程序**不会**自动创建 config.toml。没有该文件时按本文件的默认值运行。
# 需要可编辑的配置时：
#   ofm-server config > config.toml
#
# 本文件是严格校验的：出现未知字段会导致启动失败。升级后若报
# "unknown field"，说明该字段已移除或改名，请对照新版本文件修改。

# 服务绑定 IP。默认只监听本机。
# 需要局域网访问时改为 "0.0.0.0"（注意：本服务无需 API key，暴露有风险）。
host = "127.0.0.1"

# 服务监听端口。
port = 3060

# 签到间隔（秒），按供应商 id 分别配置。
#
# 每个供应商**独立计时**，互不影响：某个账号签到慢或失败，
# 不会拖慢其它供应商的节奏。服务启动时先各跑一轮，之后按间隔重复。
#
# 取值要求：不小于 60 秒。小于 60 会直接报错并终止启动
# （不会静默纠正，避免配置写错却无感知）。
#
# 单位为秒：1h = 3600，6h = 21600，12h = 43200，24h = 86400。
#
# ⚠️ 未在此列出的供应商使用内置兜底值：
#     trae    = 6h  (21600)
#     raccoon = 12h (43200)
#   其它未知供应商 = 6h (21600)
[claim_intervals]
trae = 21600
raccoon = 43200
