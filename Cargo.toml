[package]
name = "ofm-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs", "process"] }
axum = "0.8"
# 使用 rustls 的 no-provider 模式：加密算法实现由下方 rustls-rustcrypto 提供，
# 全纯 Rust，不引入 ring / aws-lc-rs（避免 C 代码与额外构建工具）。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "http2", "stream", "json", "cookies"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.1.0-pre.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
bytes = "1"
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
url = "2"
base64 = "0.22"
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
async-trait = "0.1.92"
anyhow = "1.0.104"
rand_core = { version = "0.6", features = ["getrandom"] }
time = "0.3"
sha1 = "0.10"
md-5 = "0.10"

# release 优化：TLS 加解密是纯 Rust 实现（rustls-rustcrypto），是全链路上
# CPU 最重的部分，跨 crate 内联与单 codegen unit 对吞吐有明显收益。
[profile.release]
lto = "thin"
codegen-units = 1
