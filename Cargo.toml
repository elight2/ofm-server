[package]
name = "ofm-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs", "process"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
bytes = "1"
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
async-trait = "0.1.92"
anyhow = "1.0.104"
rand_core = { version = "0.6", features = ["getrandom"] }
time = "0.3"
